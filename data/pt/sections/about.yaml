# a summary about you
summary: 'Sou uma cientista de dados com formação acadêmica. Possuo graduação em Física, mestrado e doutorado em Astronomia. Sou uma programadora autodidata e adoro programar! Atualmente, lidero um pequeno time de cientistas de dados e desenvolvedores especializados em software para apoiar e-ciência. Construímos plataformas online para ajudar astrônomos a fazer análise de grandes volumes de dados. Também sou gerente de programa do BRA-LIN, o programa de contribuição em espécie brasileira para LSST, responsável pela implantação e operações do Centro Independente Brasileiro de Acesso a Dados do Observatório Rubin. Curiosidade: no meu tempo livre, estudo música. Toco baixo em uma banda de rock familiar e comecei a aprender piano durante a pandemia.'

